apiVersion: batch/v1
kind: CronJob
metadata:
  name: warm-quality-knn
spec:
  # Keeps the MiniLM HNSW files of posts_recent_quality in the page cache. Ingest
  # churn evicts them within ~5 min, a cold kNN walk then takes 10-28 s and the
  # api's LLM candidate generator times out at 4 s (api#541). The field only gets
  # ~30 real queries a day, so this sweep is the traffic that keeps it warm.
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 540  # a run takes 10-20 s, ~2 min from fully cold
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: warm
            image: python:3.12-alpine
            resources:
              requests: {cpu: 50m, memory: 64Mi}
              limits: {cpu: 500m, memory: 256Mi}
            env:
            - name: ES_SERVICE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: es-service-user-secret
                  key: password
            - name: WARM_ALIAS
              value: posts_recent_quality
            - name: WARM_FIELD
              value: embeddings.all_MiniLM_L12_v2
            # Query vectors per run (random recent posts); 60 covered a 1M-doc shard.
            - name: WARM_VECTORS
              value: "60"
            - name: WARM_NUM_CANDIDATES
              value: "1000"
            # ES pins a preference string to one shard copy; four strings reach both.
            - name: WARM_PREFERENCES
              value: "warm-0,warm-1,warm-2,warm-3"
            - name: WARM_MAX_AGE_HOURS  # same freshness filter as the generator
              value: "168"
            command:
            - python3
            - -c
            - |
              import base64, json, os, ssl, statistics, sys, time, urllib.request

              env = os.environ
              alias, field = env["WARM_ALIAS"], env["WARM_FIELD"]
              num_candidates = int(env["WARM_NUM_CANDIDATES"])
              fresh = {"range": {"created_at": {"gte": f"now-{env['WARM_MAX_AGE_HOURS']}h"}}}
              auth = "Basic " + base64.b64encode(f"es-service-user:{env['ES_SERVICE_PASSWORD']}".encode()).decode()
              ctx = ssl.create_default_context()
              ctx.check_hostname, ctx.verify_mode = False, ssl.CERT_NONE

              def search(body, params=""):
                  req = urllib.request.Request(
                      f"https://greenearth-es-http:9200/{alias}/_search{params}",
                      data=json.dumps(body).encode(),
                      headers={"Authorization": auth, "Content-Type": "application/json"},
                  )
                  with urllib.request.urlopen(req, context=ctx, timeout=180) as resp:
                      return json.load(resp)

              # New random sample each run so sweeps cover different regions.
              hits = search({
                  "size": int(env["WARM_VECTORS"]), "_source": False, "fields": [field],
                  "query": {"function_score": {
                      "query": {"bool": {"filter": [fresh, {"exists": {"field": field}}]}},
                      "random_score": {"seed": int(time.time()), "field": "_seq_no"},
                  }},
              })["hits"]["hits"]
              if not hits:
                  sys.exit(f"{alias}: no {field} documents in the last {env['WARM_MAX_AGE_HOURS']} h")

              started, tooks = time.monotonic(), []
              for hit in hits:
                  for pref in env["WARM_PREFERENCES"].split(","):
                      tooks.append(search({
                          "size": 1, "_source": False,
                          "knn": {"field": field, "query_vector": hit["fields"][field],
                                  "k": min(100, num_candidates), "num_candidates": num_candidates,
                                  "filter": fresh},
                      }, params=f"?preference={pref}")["took"])
              print(f"{alias}: {len(tooks)} kNN queries in {time.monotonic() - started:.0f} s wall; "
                    f"took median {statistics.median(tooks):.0f} ms, max {max(tooks)} ms, sum {sum(tooks) / 1000:.1f} s")

apiVersion: batch/v1
kind: CronJob
metadata:
  name: warm-quality-knn
spec:
  # Keeps the MiniLM HNSW files of posts_recent_quality in the page cache.
  # Ingest churn evicts them within ~5 min; a cold kNN walk then takes 10-28 s
  # and the api's LLM candidate generator times out at 4 s (api#541). The field
  # gets ~30 real queries a day, so this sweep is the traffic that keeps it warm.
  # Measured on prod 2026-10-16: 40 s of ES time from cold, 7 s once warm.
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # A run takes 10-20 s (about 2 min from fully cold); this is only the cap.
      activeDeadlineSeconds: 540
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: warm
            image: python:3.12-alpine
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 256Mi
            env:
            - name: ES_SERVICE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: es-service-user-secret
                  key: password
            - name: WARM_ALIAS
              value: posts_recent_quality
            - name: WARM_FIELDS
              value: embeddings.all_MiniLM_L12_v2
            # Query vectors per run (random recent posts); 60 covered a 1M-doc shard.
            - name: WARM_VECTORS
              value: "60"
            - name: WARM_NUM_CANDIDATES
              value: "1000"
            # ES pins a preference string to one shard copy; four strings reach both.
            - name: WARM_PREFERENCES
              value: "warm-0,warm-1,warm-2,warm-3"
            # Same freshness filter as the generator.
            - name: WARM_MAX_AGE_HOURS
              value: "168"
            command:
            - python3
            - -c
            - |
              import json, os, ssl, statistics, sys, time, urllib.request, base64

              ES = "https://greenearth-es-http:9200"
              AUTH = "Basic " + base64.b64encode(
                  ("es-service-user:" + os.environ["ES_SERVICE_PASSWORD"]).encode()
              ).decode()
              alias = os.environ["WARM_ALIAS"]
              fields = [f for f in os.environ["WARM_FIELDS"].split(",") if f]
              n_vectors = int(os.environ["WARM_VECTORS"])
              num_candidates = int(os.environ["WARM_NUM_CANDIDATES"])
              preferences = [p for p in os.environ["WARM_PREFERENCES"].split(",") if p]
              max_age = os.environ["WARM_MAX_AGE_HOURS"]
              fresh = {"range": {"created_at": {"gte": f"now-{max_age}h"}}}

              ctx = ssl.create_default_context()
              ctx.check_hostname = False
              ctx.verify_mode = ssl.CERT_NONE

              def search(body, params="", timeout=180):
                  req = urllib.request.Request(
                      f"{ES}/{alias}/_search{params}",
                      data=json.dumps(body).encode(),
                      headers={"Authorization": AUTH, "Content-Type": "application/json"},
                  )
                  with urllib.request.urlopen(req, context=ctx, timeout=timeout) as resp:
                      return json.load(resp)

              # New random sample each run so sweeps cover different regions.
              sample = search({
                  "size": n_vectors,
                  "_source": False,
                  "fields": fields,
                  "query": {"function_score": {
                      "query": {"bool": {"filter": [fresh] + [{"exists": {"field": f}} for f in fields]}},
                      "random_score": {"seed": int(time.time()), "field": "_seq_no"},
                  }},
              })
              hits = sample["hits"]["hits"]
              if not hits:
                  print(f"{alias}: no documents with {fields} in the last {max_age} h, nothing to warm")
                  sys.exit(0)

              started = time.monotonic()
              tooks = []
              for field in fields:
                  for hit in hits:
                      vector = hit["fields"][field]
                      for pref in preferences:
                          resp = search({
                              "size": 1,
                              "_source": False,
                              "knn": {
                                  "field": field,
                                  "query_vector": vector,
                                  "k": min(100, num_candidates),
                                  "num_candidates": num_candidates,
                                  "filter": {"bool": {"filter": [fresh]}},
                              },
                          }, params=f"?preference={pref}")
                          tooks.append(resp["took"])

              print(
                  f"{alias}: warmed {fields} with {len(hits)} vectors x {len(preferences)} copies, "
                  f"{len(tooks)} queries in {time.monotonic() - started:.0f} s wall; "
                  f"took median {statistics.median(tooks):.0f} ms, max {max(tooks)} ms, "
                  f"sum {sum(tooks) / 1000:.1f} s"
              )
